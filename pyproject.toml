[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "time-tg-bot"
version = "0.1.0"
description = "Telegram bot starter template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "aiogram>=3.4,<4.0",
  "SQLAlchemy>=2.0,<3.0",
  "aiosqlite>=0.20,<1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
